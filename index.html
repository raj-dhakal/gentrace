<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenTrace - Sign Up</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>GenTrace</h1>
    </header>
    <main>
      <form id="signup-form">
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="firstName" required />

        <label for="middle-name">Middle Name</label>
        <input type="text" id="middle-name" name="middleName" />

        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="lastName" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" required />

        <fieldset>
          <legend>Married</legend>
          <label><input type="radio" name="married" value="yes" /> Yes</label>
          <label><input type="radio" name="married" value="no" checked /> No</label>
        </fieldset>

        <div id="spouse-section" hidden>
          <label for="spouse-first-name">Spouse First Name</label>
          <input type="text" id="spouse-first-name" name="spouseFirstName" />
        </div>

        <fieldset>
          <legend>Kids</legend>
          <label><input type="radio" name="kids" value="yes" /> Yes</label>
          <label><input type="radio" name="kids" value="no" checked /> No</label>
        </fieldset>

        <div id="kids-section" hidden>
          <label for="kid-first-name">Kid's First Name</label>
          <input type="text" id="kid-first-name" name="kidFirstName" />
        </div>

        <button type="submit">Sign Up</button>
      </form>
    </main>
  </body>
</html>
